<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twelve: Find a S-fellowship meeting today</title>
  <meta name="description" content="Discover 300+ twelve-step meetings, in person, on Zoom, and by phone for porn, sex, and love addiction." />

  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Twelve" />
  <meta property="og:title" content="Twelve: Find a S-fellowship meeting today" />
  <meta property="og:description" content="Discover 300+ twelve-step meetings, in person, on Zoom, and by phone for porn, sex, and love addiction." />
  <meta property="og:url" content="https://usetwelve.app/" />
  <meta property="og:image" content="https://usetwelve.app/assets/social.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Twelve: Find a S-fellowship meeting today" />
  <meta name="twitter:description" content="Discover 300+ twelve-step meetings, in person, on Zoom, and by phone for porn, sex, and love addiction." />
  <meta name="twitter:image" content="https://usetwelve.app/assets/social.png" />
  <style>
    @font-face {
      font-family: "Inter Display";
      src: url("assets/InterDisplay-SemiBold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("assets/Inter-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #f3f7d2;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Logo — top 70 / left 72, 156x40 */
    .logo {
      position: absolute;
      top: 70px;
      left: 72px;
      width: 156px;
      height: 40px;
    }
    .logo .mark {
      position: absolute;
      left: 0; top: 0;
      width: 40px; height: 40px;
    }
    .logo .wordmark {
      position: absolute;
      left: 50.65px;
      top: 7.73px;
      width: 103.19px;
      height: 24.58px;
    }

    /* Hero — left 72, vertically centered, 593 wide, column gap 21 */
    .hero {
      position: absolute;
      left: 72px;
      top: calc(50% + 0.5px);
      transform: translateY(-50%);
      width: 593px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 21px;
    }

    .badges {
      display: flex;
      gap: 11px;
      align-items: center;
    }
    .badge {
      width: 40px;
      height: 40px;
      border-radius: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      flex-shrink: 0;
    }
    .badge img { display: block; }
    .badge.saa  { background: #6fbf8b; }
    .badge.slaa { background: #d66ba0; }
    .badge.sa   { background: #e8e6e1; }
    .badge.sra  { background: #d08b5b; }
    .badge.sca  { background: #7b8cde; }
    .badge.saa  img { width: 31.906px; height: 11.836px; }
    .badge.slaa img { width: 36.107px; height: 10.356px; }
    .badge.sa   img { width: 20.531px; height: 11.836px; }
    .badge.sra  img { width: 31.406px; height: 11.836px; }
    .badge.sca  img { width: 31.906px; height: 11.836px; }

    h1 {
      font-family: "Inter Display", "Inter", sans-serif;
      font-weight: 600;
      font-size: 64px;
      line-height: 66px;
      color: #000;
      word-break: break-word;
    }

    .subhead {
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 20px;
      line-height: normal;
      color: #000;
      opacity: 0.6;
      word-break: break-word;
    }

    .app-store {
      display: block;
      height: 48px;
      width: auto;
    }
    .app-store img {
      display: block;
      height: 48px;
      width: auto;
    }

    /* iPhone — pinned bottom-right, overflowing edges.
       PNG (Jon's asset) includes a baked soft shadow spilling down-right;
       box is sized so the PHONE BODY renders 368px wide with its right
       edge 99px from the viewport edge, matching the Figma placement. */
    .phone {
      position: absolute;
      right: 24px;
      bottom: 3px;
      height: min(932px, 92vh);
      aspect-ratio: 1400 / 2426;
      pointer-events: none;
    }
    .phone img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Footer — pinned bottom, logo left + links right */
    .site-footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 72px 54px;
      z-index: 2;
    }
    .site-footer .credits {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1500px;
    }
    .footer-logo { position: relative; width: 124.8px; height: 32px; display: block; }
    .footer-logo .mark { position: absolute; left: 0; top: 0; width: 32px; height: 32px; }
    .footer-logo .wordmark { position: absolute; left: 40.52px; top: 6.19px; width: 82.55px; height: 19.66px; }
    .footer-links {
      display: flex;
      gap: 40px;
      align-items: center;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    .footer-links a { color: inherit; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }

    /* ---------- Mobile ---------- */
    @media (max-width: 1100px) {
      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: visible;
        padding: 120px 24px 0;
      }
      .logo { left: 24px; top: 32px; }
      .hero {
        position: static;
        transform: none;
        width: 100%;
        max-width: 593px;
        align-items: center;
        text-align: center;
        margin-top: 24px;
      }
      h1 { font-size: 44px; line-height: 48px; }
      .subhead { font-size: 18px; }
      .phone {
        position: static;
        width: min(426px, 89vw);
        height: auto;
        aspect-ratio: 1400 / 2426;
        margin-top: 24px;
        margin-bottom: 16px;
        /* asset's shadow is right-heavy: device body center sits at 38.4%
           of image width, so shift right 11.6% to center the DEVICE */
        transform: translateX(11.6%);
      }
      .phone img { position: static; }

      .site-footer {
        position: static;
        padding: 40px 16px;
        width: 100%;
      }
      .site-footer .credits {
        flex-direction: column-reverse;
        gap: 39px;
        align-items: center;
      }
      .footer-links { width: 100%; justify-content: space-between; gap: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="logo" href="/" aria-label="Twelve">
      <img class="mark" src="assets/logo-mark.png" alt="Twelve logo" />
      <img class="wordmark" src="assets/wordmark.svg" alt="Twelve" />
    </a>

    <section class="hero">
      <div class="badges" aria-label="Programs: SAA, SLAA, SA, SRA, SCA">
        <div class="badge saa"><img src="assets/saa.svg" alt="SAA" /></div>
        <div class="badge slaa"><img src="assets/slaa.svg" alt="SLAA" /></div>
        <div class="badge sa"><img src="assets/sa.svg" alt="SA" /></div>
        <div class="badge sra"><img src="assets/sra.svg" alt="SRA" /></div>
        <div class="badge sca"><img src="assets/sca.svg" alt="SCA" /></div>
      </div>

      <h1>Find a S&#8209;fellowship meeting&nbsp;today</h1>

      <p class="subhead">Discover 300+ twelve-step meetings, in person, on Zoom, and by phone for porn, sex, and love addiction</p>

      <a class="app-store" href="https://apps.apple.com/app/id6805293686" aria-label="Download on the App Store">
        <img src="assets/app-store-badge.svg" alt="Download on the App Store" />
      </a>
    </section>

    <div class="phone">
      <img src="assets/iphone.png" alt="Twelve app showing a list of meetings" />
    </div>

    <footer class="site-footer">
      <div class="credits">
        <a class="footer-logo" href="/" aria-label="Twelve home">
          <img class="mark" src="assets/logo-mark.png" alt="" />
          <img class="wordmark" src="assets/wordmark.svg" alt="Twelve" />
        </a>
        <div class="footer-links">
          <a href="/terms-conditions">Terms &amp; Conditions</a>
          <a href="/privacy">Privacy Policy</a>
          <span>All Rights Reserved</span>
        </div>
      </div>
    </footer>
  </main>
</body>
</html>
